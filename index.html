<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Bolão Copa 2026</title>
<!-- CryptoJS para criptografia AES -->

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap');
:root{
  --verde:#1a7a3c;--verde-claro:#22a050;--amarelo:#f5c518;
  --azul-escuro:#0d1b2a;--azul-card:#1e3450;--texto:#e8ecf0;
  --texto-dim:#8fa3b8;--borda:#2a4060;--ouro:#f5c518;
  --prata:#b0bec5;--bronze:#cd7f32;--vermelho:#e53935;--radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--azul-escuro);color:var(--texto);font-family:'Inter',sans-serif;min-height:100vh;}

.header{background:linear-gradient(135deg,var(--verde) 0%,var(--azul-escuro) 60%);padding:18px 24px 0;border-bottom:3px solid var(--amarelo);}
.header-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
.logo{font-family:'Bebas Neue',cursive;font-size:1.9rem;letter-spacing:2px;color:var(--amarelo);}
.logo span{color:#fff;}
.user-badge{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid var(--borda);border-radius:50px;padding:7px 14px;font-size:.83rem;cursor:pointer;}
.user-badge .dot{width:7px;height:7px;background:var(--verde-claro);border-radius:50%;flex-shrink:0;}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:11px 18px;font-size:.83rem;font-weight:600;color:var(--texto-dim);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none;}
.tab:hover{color:var(--texto);}
.tab.active{color:var(--amarelo);border-bottom-color:var(--amarelo);}

main{padding:20px 16px 80px;max-width:960px;margin:0 auto;}
.screen{display:none;}
.screen.active{display:block;}

/* LOGIN */
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
.login-card{background:var(--azul-card);border:1px solid var(--borda);border-radius:var(--radius);padding:38px 30px;width:100%;max-width:380px;text-align:center;}
.login-card h2{font-family:'Bebas Neue',cursive;font-size:1.8rem;color:var(--amarelo);margin-bottom:6px;}
.login-card p{color:var(--texto-dim);font-size:.88rem;margin-bottom:22px;}
.input-group{margin-bottom:14px;text-align:left;}
.input-group label{display:block;font-size:.75rem;font-weight:600;color:var(--texto-dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.input-group input,.input-group select{width:100%;background:var(--azul-escuro);border:1px solid var(--borda);color:var(--texto);padding:10px 13px;border-radius:6px;font-size:.93rem;outline:none;transition:border-color .2s;font-family:'Inter',sans-serif;}
.input-group input:focus,.input-group select:focus{border-color:var(--verde-claro);}
.btn-primary{width:100%;background:var(--verde);color:#fff;font-weight:700;font-size:.95rem;padding:12px;border:none;border-radius:6px;cursor:pointer;transition:background .2s;font-family:'Inter',sans-serif;}
.btn-primary:hover{background:var(--verde-claro);}
.btn-link{background:none;border:none;color:var(--texto-dim);font-size:.8rem;cursor:pointer;font-family:'Inter',sans-serif;margin-top:14px;}

/* SECTION */
.section-title{font-family:'Bebas Neue',cursive;font-size:1.35rem;color:var(--amarelo);letter-spacing:2px;margin-bottom:3px;}
.section-sub{font-size:.8rem;color:var(--texto-dim);margin-bottom:14px;}
.stats-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.stat-pill{background:var(--azul-card);border:1px solid var(--borda);border-radius:50px;padding:7px 13px;font-size:.8rem;display:flex;align-items:center;gap:5px;}
.stat-pill strong{color:var(--amarelo);}

/* RODADA */
.rodada-bloco{margin-top:18px;}
.rodada-label{font-family:'Bebas Neue',cursive;font-size:.95rem;color:var(--amarelo);letter-spacing:1px;margin-bottom:2px;}
.dia-label{font-size:.79rem;color:var(--texto-dim);margin-bottom:8px;padding-left:2px;}

/* CARD JOGO */
.jogo-card{background:var(--azul-card);border:1px solid var(--borda);border-radius:var(--radius);padding:13px 15px;margin-bottom:8px;transition:border-color .2s;}
.jogo-card.locked{border-left:3px solid var(--borda);}
.jogo-card.salvo{border-left:3px solid var(--verde-claro);}
.jogo-card.editando{border-left:3px solid var(--amarelo);}
.jogo-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.jogo-grupo-tag{font-size:.7rem;color:var(--texto-dim);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.jogo-hora-tag{font-size:.73rem;color:var(--texto-dim);}

/* CONFRONTO */
.confronto{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;}
.time-bloco{display:flex;align-items:center;gap:5px;}
.time-bloco.direita{flex-direction:row-reverse;}
.flag{width:28px;height:21px;object-fit:cover;border-radius:2px;flex-shrink:0;display:inline-block;vertical-align:middle;}.flag-sm{width:22px;height:16px;object-fit:cover;border-radius:2px;vertical-align:middle;margin-right:2px;}
.time-nome-txt{font-weight:600;font-size:.86rem;line-height:1.2;}
.placar-area{display:flex;align-items:center;gap:5px;justify-content:center;}
.placar-input{width:44px;height:36px;background:var(--azul-escuro);border:2px solid var(--borda);color:var(--texto);font-size:1.05rem;font-weight:700;text-align:center;border-radius:6px;outline:none;transition:border-color .2s;font-family:'Inter',sans-serif;-moz-appearance:textfield;}
.placar-input::-webkit-outer-spin-button,.placar-input::-webkit-inner-spin-button{-webkit-appearance:none;}
.placar-input:focus{border-color:var(--verde-claro);}
.placar-input:disabled{opacity:.4;cursor:not-allowed;}
.placar-sep{color:var(--texto-dim);font-weight:700;font-size:.88rem;}

/* AÇÕES */
.card-acoes{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:6px;flex-wrap:wrap;}
.pts-label{font-size:.79rem;color:var(--texto-dim);}
.pts-val{font-weight:700;}
.pts-7{color:var(--ouro);}
.pts-5,.pts-6{color:var(--verde-claro);}
.pts-2,.pts-3,.pts-4{color:#64b5f6;}
.pts-0{color:var(--texto-dim);}
.btn-salvar-p{background:var(--verde);color:#fff;font-weight:700;font-size:.78rem;padding:7px 16px;border:none;border-radius:50px;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:4px;transition:background .2s;}
.btn-salvar-p:hover{background:var(--verde-claro);}
.btn-salvar-p:disabled{opacity:.6;cursor:not-allowed;}
.btn-editar-p{background:none;color:var(--amarelo);font-weight:600;font-size:.76rem;padding:6px 12px;border:1px solid var(--amarelo);border-radius:50px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;}
.btn-editar-p:hover{background:rgba(245,197,24,.1);}
.btn-cancelar-p{background:none;color:var(--texto-dim);font-weight:600;font-size:.76rem;padding:6px 12px;border:1px solid var(--borda);border-radius:50px;cursor:pointer;font-family:'Inter',sans-serif;}
.status-salvo-tag{font-size:.76rem;color:var(--verde-claro);display:flex;align-items:center;gap:3px;}
.status-locked-tag{font-size:.76rem;color:var(--texto-dim);}
.resultado-real-row{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:7px;font-size:.76rem;color:var(--texto-dim);}
.placar-real-val{font-weight:700;color:var(--amarelo);}

/* SAVING SPINNER */
.saving-txt{font-size:.76rem;color:var(--texto-dim);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* RANKING */
.ranking-card{background:var(--azul-card);border:1px solid var(--borda);border-radius:var(--radius);overflow:hidden;margin-bottom:8px;}
.ranking-row{display:flex;align-items:center;padding:13px 15px;gap:12px;border-bottom:1px solid var(--borda);cursor:pointer;transition:background .15s;}
.ranking-row:hover{background:rgba(255,255,255,.03);}
.ranking-row:last-child{border-bottom:none;}
.rank-pos{font-family:'Bebas Neue',cursive;font-size:1.4rem;min-width:34px;text-align:center;}
.rank-pos.gold{color:var(--ouro);}
.rank-pos.silver{color:var(--prata);}
.rank-pos.bronze{color:var(--bronze);}
.rank-pos.normal{color:var(--texto-dim);}
.rank-nome{flex:1;font-weight:600;}
.rank-pts{font-family:'Bebas Neue',cursive;font-size:1.35rem;color:var(--amarelo);}
.rank-stats{font-size:.73rem;color:var(--texto-dim);text-align:right;}

/* DETALHE */
.detalhe-jogo{display:flex;align-items:center;justify-content:space-between;background:var(--azul-card);border:1px solid var(--borda);border-radius:8px;padding:11px 14px;margin-bottom:7px;gap:8px;flex-wrap:wrap;}
.dj-times{font-size:.83rem;font-weight:500;flex:1;min-width:140px;}
.dj-palpite{font-size:.78rem;color:var(--texto-dim);}
.dj-palpite strong{color:var(--texto);}
.dj-pts{font-weight:700;min-width:50px;text-align:right;font-size:.88rem;}

/* ADMIN */
.admin-card{background:var(--azul-card);border:1px solid var(--borda);border-radius:var(--radius);padding:13px 15px;margin-bottom:7px;}
.admin-jogo-nome{font-weight:600;margin-bottom:9px;font-size:.85rem;}
.admin-inputs{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.admin-inputs input{width:50px;height:34px;background:var(--azul-escuro);border:1px solid var(--borda);color:var(--texto);font-size:.95rem;font-weight:700;text-align:center;border-radius:6px;outline:none;font-family:'Inter',sans-serif;-moz-appearance:textfield;}
.admin-inputs input::-webkit-outer-spin-button,.admin-inputs input::-webkit-inner-spin-button{-webkit-appearance:none;}
.admin-inputs input:focus{border-color:var(--amarelo);}
.btn-admin-save{background:var(--amarelo);color:var(--azul-escuro);font-weight:700;font-size:.8rem;padding:7px 13px;border:none;border-radius:6px;cursor:pointer;font-family:'Inter',sans-serif;}.btn-admin-clear{background:none;color:var(--vermelho);font-weight:600;font-size:.78rem;padding:6px 10px;border:1px solid var(--vermelho);border-radius:6px;cursor:pointer;font-family:'Inter',sans-serif;}
.status-admin{font-size:.77rem;color:var(--verde-claro);}

/* PALPITES VIEW (admin) */
.palpites-view-header{display:grid;font-size:.72rem;font-weight:700;color:var(--texto-dim);text-transform:uppercase;letter-spacing:.4px;padding:8px 14px;border-bottom:1px solid var(--borda);background:rgba(0,0,0,.2);}
.palpites-view-row{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--borda);gap:10px;font-size:.83rem;}
.palpites-view-row:last-child{border-bottom:none;}
.pv-usuario{font-weight:600;min-width:110px;flex-shrink:0;}
.pv-palpite{font-family:'Bebas Neue',cursive;font-size:1.1rem;color:var(--amarelo);min-width:60px;}
.pv-pts{font-weight:700;min-width:55px;text-align:right;}
.pv-sem{color:var(--texto-dim);font-style:italic;font-size:.78rem;}

/* FILTER */
.filter-bar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;}
.filter-btn{background:var(--azul-card);border:1px solid var(--borda);color:var(--texto-dim);padding:5px 11px;border-radius:50px;font-size:.76rem;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;}
.filter-btn.active{background:var(--verde);border-color:var(--verde);color:#fff;}

/* JOGOS TAB */
.placar-exibido{font-family:'Bebas Neue',cursive;font-size:1.25rem;color:var(--amarelo);}
.vs-txt{color:var(--texto-dim);font-size:.83rem;}

/* EMPTY */
.empty-state{text-align:center;padding:50px 20px;color:var(--texto-dim);}
.empty-state .icon{font-size:2.8rem;margin-bottom:10px;}

/* TOAST */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--verde);color:#fff;padding:9px 22px;border-radius:50px;font-size:.88rem;font-weight:600;opacity:0;transition:all .3s;z-index:9999;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* LOADING OVERLAY */
#loadingOverlay{position:fixed;inset:0;background:rgba(13,27,42,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9998;}
#loadingOverlay.show{display:flex;}
.spinner{width:40px;height:40px;border:4px solid var(--borda);border-top-color:var(--amarelo);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-txt{color:var(--texto-dim);font-size:.88rem;}

/* BTN CARREGAR ADMIN */
.btn-carregar{background:var(--verde);color:#fff;font-weight:700;font-size:.9rem;padding:11px 24px;border:none;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;gap:7px;transition:background .2s;}
.btn-carregar:hover{background:var(--verde-claro);}

@media(max-width:480px){
  .logo{font-size:1.45rem;}
  .tab{padding:9px 11px;font-size:.76rem;}
  .time-nome-txt{font-size:.78rem;}
  .flag{font-size:1.1rem;}
  .placar-input{width:38px;height:33px;}
}
</style>
</head>

<!-- ======== ADMIN SCREEN ======== -->

    </div>
  </div>
  <main>
    <div id="adminTabPalpites" class="screen active"></div>
    <div id="adminTabResultados" class="screen"></div>
    <div id="adminTabRanking" class="screen"></div>
    <div id="adminTabParticipantes" class="screen"></div>
  </main>
</div>

<!-- ======== DETALHE PARTICIPANTE ======== -->
<div id="detalheScreen" style="display:none;">
  <div class="header">
    <div class="header-top">
      <div class="logo">⚽ <span id="detalheNomeHeader"></span></div>

    </div>
  </div>
  <main id="detalheContent" style="padding-top:18px;"></main>
</div>

<!-- LOADING -->
<div id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-txt" id="loadingTxt">Salvando...</div>
</div>
<div id="toast"></div>

// ================================================================
// CRYPTO
// ================================================================
function encrypt(texto) {
  return CryptoJS.AES.encrypt(String(texto), CRYPTO_KEY).toString();
}
function decrypt(cifrado) {
  try {
    var bytes = CryptoJS.AES.decrypt(cifrado, CRYPTO_KEY);
    return bytes.toString(CryptoJS.enc.Utf8);
  } catch(e) { return ''; }
}
function encryptPalpite(g1, g2) {
  return encrypt(g1 + '|' + g2);
}
function decryptPalpite(cifrado) {
  var txt = decrypt(cifrado);
  if (!txt || txt.indexOf('|') === -1) return null;
  var p = txt.split('|');
  return {g1: p[0], g2: p[1]};
}

// ================================================================
// PONTUAÇÃO
// ================================================================
function calcPontos(palpite, resultado) {
  if (!palpite || palpite.g1 === '' || palpite.g2 === '') return null;
  if (!resultado || resultado.g1 === '' || resultado.g2 === undefined) return null;
  var pg1=parseInt(palpite.g1), pg2=parseInt(palpite.g2);
  var rg1=parseInt(resultado.g1), rg2=parseInt(resultado.g2);
  if (isNaN(pg1)||isNaN(pg2)||isNaN(rg1)||isNaN(rg2)) return null;
  var resP=pg1>pg2?1:pg1<pg2?-1:0;
  var resR=rg1>rg2?1:rg1<rg2?-1:0;
  var acertouRes = resP===resR;
  var acertouG1  = pg1===rg1;
  var acertouG2  = pg2===rg2;
  var acertouExato = acertouG1 && acertouG2;
  // Placar exato = máximo 7 pts (independente de resultado)
  if (acertouExato) return 7;
  var pts = 0;
  if (acertouRes) pts += 2;
  if (acertouG1)  pts += 1;
  if (acertouG2)  pts += 1;
  return pts;
}

// ================================================================
// TRAVAMENTO — UTC-3 (Brasília)
// ================================================================
function jogoTravado(jogo) {
  return new Date() >= new Date(jogo.data + 'T' + jogo.hora + ':00-03:00');
}

// ================================================================
// GOOGLE APPS SCRIPT — chamadas
// ================================================================
function gasCall(payload, callback) {
  fetch(GAS_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain'},
    body: JSON.stringify(payload)
  })
  .then(function(r){ return r.json(); })
  .then(function(data){ callback(data); })
  .catch(function(e){ callback({ok: false, erro: e.message}); });
}

// Salvar palpite na planilha
function gasSalvarPalpite(usuario, jogoId, cifrado, callback) {
  gasCall({
    acao: 'salvar_palpite',
    usuario: usuario,
    jogo_id: jogoId,
    palpite_enc: cifrado,
    timestamp: new Date().toLocaleString('pt-BR', {timeZone:'America/Sao_Paulo'})
  }, callback);
}

  carregarResultadosDaPlanilha(function(){});

// ================================================================
// RESULTADOS — sincronização com a planilha (todos os usuários)
// ================================================================
function carregarResultadosDaPlanilha(callback) {
  gasCarregarResultados(function(resp) {
    if (resp && resp.ok) {
      var dados = resp.dados || [];
      var novo = {};
      dados.forEach(function(linha) {
        novo[linha.jogo_id] = {g1: String(linha.g1), g2: String(linha.g2)};
      });
      resultadosCache = novo;
      localStorage.setItem('bolao26_resultados', JSON.stringify(resultadosCache));
    }
    if (callback) callback(resp);
  });
}

// Carrega palpites de TODOS os usuários (usado no ranking)
function carregarTodosPalpites(callback) {
  gasCarregarPalpites(function(resp) {
    if (resp && resp.ok) {
      var dados = resp.dados || [];
      dados.forEach(function(linha) {
        var dec = decryptPalpite(linha.palpite_enc);
        if (dec) {
          if (!palpitesCache[linha.usuario]) palpitesCache[linha.usuario] = {};
          palpitesCache[linha.usuario][linha.jogo_id] = dec;
        }
      });
    }
    if (callback) callback(resp);
  });
}

function entrar() {
  var campoLogin = document.getElementById('loginSelect');
  var campoSenha = document.getElementById('loginSenha');
  var login = campoLogin.value.trim().toLowerCase();
  var senha = campoSenha.value;
  var erroEl = document.getElementById('loginErro');
  erroEl.textContent = '';

  if (!login) {
    erroEl.textContent = '⚠️ Digite seu login.';
    campoLogin.focus();
    return;
  }
  if (!senha) {
    erroEl.textContent = '⚠️ Digite sua senha.';
    campoSenha.focus();
    return;
  }

  // Valida login (case-insensitive)
  var loginValido = null;
  for (var i = 0; i < LOGINS.length; i++) {
    if (LOGINS[i].toLowerCase() === login) {
      loginValido = LOGINS[i];
      break;
    }
  }

  if (!loginValido) {
    erroEl.textContent = '❌ Usuário ou senha incorretos.';
    campoLogin.select();
    return;
  }

  // Valida senha
  if (USUARIOS[loginValido] !== senha) {
    erroEl.textContent = '❌ Usuário ou senha incorretos.';
    campoSenha.value = '';
    campoSenha.focus();
    return;
  }

  currentUser = loginValido;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('userBadgeName').textContent = loginValido;
  campoLogin.value = '';
  campoSenha.value = '';
  // Carrega palpites do cache local
  var cached = localStorage.getItem('bolao26_palpites_' + loginValido);
  if (cached) { try { palpitesCache[loginValido] = JSON.parse(cached); } catch(e){} }
  showTab('palpites');
}

// RENDER MEUS PALPITES
// ================================================================
function renderPalpites() {
  var el = document.getElementById('tabPalpites');
  var meus = (palpitesCache[currentUser] || {});

  var totalPts=0, salvos=0, exatos=0;
  JOGOS.forEach(function(j) {
    var p=meus[j.id];
    if(p&&p.g1!==''&&p.g2!=='') salvos++;
    var pts=calcPontos(p, resultadosCache[j.id]);
    if(pts!==null){ totalPts+=pts; if(pts===7) exatos++; }
  });

  var html='<div class="section-title">MEUS PALPITES</div>';
  html+='<div class="section-sub">Salve antes do jogo começar. Você pode editar até o horário de início.</div>';
  html+='<div class="stats-bar">';
  html+='<div class="stat-pill">⚽ Salvos: <strong>'+salvos+'/48</strong></div>';
  html+='<div class="stat-pill">🏆 Pontos: <strong>'+totalPts+'</strong></div>';
  html+='<div class="stat-pill">⭐ Exatos: <strong>'+exatos+'</strong></div>';
  html+='</div>';

  for(var rod=1;rod<=3;rod++){
    var jogsR=JOGOS.filter(function(j){return j.rodada===rod;});
    var datas=[];
    jogsR.forEach(function(j){if(datas.indexOf(j.data)===-1)datas.push(j.data);});
    datas.sort();
    html+='<div class="rodada-bloco"><div class="rodada-label">⚽ RODADA '+rod+'</div>';
    datas.forEach(function(data){
      var d=new Date(data+'T12:00:00');
      var nomeDia=d.toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'});
      html+='<div class="dia-label">📅 '+nomeDia+'</div>';
      jogsR.filter(function(j){return j.data===data;}).forEach(function(jogo){
        html+=buildCardPalpite(jogo, meus[jogo.id], resultadosCache[jogo.id]);
      });
    });
    html+='</div>';
  }
  el.innerHTML = html;
}

function buildCardPalpite(jogo, palpite, resultado) {
  var travado=jogoTravado(jogo);
  var temP=palpite&&palpite.g1!==''&&palpite.g2!=='';
  var editMode=editando[jogo.id]===true;
  var pts=calcPontos(palpite,resultado);
  var cardCls='jogo-card'+(travado?' locked':editMode?' editando':temP?' salvo':'');
  var disabled=(travado||(temP&&!editMode))?'disabled':'';
  var vg1=(palpite&&palpite.g1!=='')?palpite.g1:'';
  var vg2=(palpite&&palpite.g2!=='')?palpite.g2:'';

  var h='<div class="'+cardCls+'" id="card_'+jogo.id+'">';
  h+='<div class="jogo-meta"><span class="jogo-grupo-tag">GRUPO '+jogo.grupo+' · '+jogo.cidade+'</span>';
  h+='<span class="jogo-hora-tag">'+(travado?'🔒 ':'⏰ ')+jogo.hora+'h</span></div>';
  h+='<div class="confronto">';
  h+='<div class="time-bloco"><img class="flag" src="https://flagcdn.com/24x18/'+jogo.f1+'.png" alt=""><span class="time-nome-txt">'+jogo.t1+'</span></div>';
  h+='<div class="placar-area">';
  h+='<input class="placar-input" type="number" min="0" max="20" placeholder="—" value="'+vg1+'" '+disabled+' id="inp_'+jogo.id+'_g1"/>';
  h+='<span class="placar-sep">x</span>';
  h+='<input class="placar-input" type="number" min="0" max="20" placeholder="—" value="'+vg2+'" '+disabled+' id="inp_'+jogo.id+'_g2"/>';
  h+='</div>';
  h+='<div class="time-bloco direita"><img class="flag" src="https://flagcdn.com/24x18/'+jogo.f2+'.png" alt=""><span class="time-nome-txt">'+jogo.t2+'</span></div>';
  h+='</div>';
  if(resultado&&resultado.g1!==''){
    h+='<div class="resultado-real-row">Resultado: <span class="placar-real-val">'+resultado.g1+' x '+resultado.g2+'</span></div>';
  }
  h+='<div class="card-acoes">';
  if(pts!==null){
    var cls=pts===7?'pts-7':pts>=5?'pts-5':pts>=2?'pts-2':'pts-0';
    h+='<span class="pts-label">Pontos: <span class="pts-val '+cls+'">'+pts+' pts</span></span>';
  } else { h+='<span></span>'; }

  if(travado){
    h+=temP
      ?'<span class="status-locked-tag">🔒 Salvo: '+vg1+' x '+vg2+'</span>'
      :'<span class="status-locked-tag">🔒 Sem palpite</span>';
  } else if(editMode){
    h+='<div style="display:flex;gap:6px;align-items:center;">';
    h+='<button class="btn-cancelar-p" onclick="cancelarEdicao(\''+jogo.id+'\')">Cancelar</button>';
    h+='<button class="btn-salvar-p" id="btnSalvar_'+jogo.id+'" onclick="salvarPalpiteCard(\''+jogo.id+'\')">💾 Salvar</button>';
    h+='</div>';
  } else if(temP){
    h+='<div style="display:flex;gap:6px;align-items:center;">';
    h+='<span class="status-salvo-tag">✅ '+vg1+' x '+vg2+'</span>';
    h+='<button class="btn-editar-p" onclick="editarPalpite(\''+jogo.id+'\')">✏️ Editar</button>';
    h+='</div>';
  } else {
    h+='<button class="btn-salvar-p" id="btnSalvar_'+jogo.id+'" onclick="salvarPalpiteCard(\''+jogo.id+'\')">💾 Salvar palpite</button>';
  }
  h+='</div></div>';
  return h;
}

function salvarPalpiteCard(jogoId) {
  var in1=document.getElementById('inp_'+jogoId+'_g1');
  var in2=document.getElementById('inp_'+jogoId+'_g2');
  if(!in1||in1.value===''||in2.value===''){
    showToast('⚠️ Preencha os dois gols!',true); return;
  }
  var g1=in1.value, g2=in2.value;
  var btn=document.getElementById('btnSalvar_'+jogoId);
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="saving-txt">Salvando...</span>'; }

  var cifrado = encryptPalpite(g1, g2);

  gasSalvarPalpite(currentUser, jogoId, cifrado, function(resp) {
    if(resp && resp.ok){
      // Atualiza cache local
      if(!palpitesCache[currentUser]) palpitesCache[currentUser]={};
      palpitesCache[currentUser][jogoId]={g1:g1,g2:g2};
      localStorage.setItem('bolao26_palpites_'+currentUser, JSON.stringify(palpitesCache[currentUser]));
      editando[jogoId]=false;
      showToast('✅ Palpite salvo: '+g1+' x '+g2);
      renderPalpites();
    } else {
      var msg = (resp && resp.erro) ? resp.erro : 'Erro desconhecido';
      showToast('❌ Erro: '+msg, true);
      if(btn){ btn.disabled=false; btn.innerHTML='💾 Salvar palpite'; }
    }
  });
}

function editarPalpite(jogoId){ editando[jogoId]=true; renderPalpites(); }
function cancelarEdicao(jogoId){ editando[jogoId]=false; renderPalpites(); }

// ================================================================
// RENDER RANKING (usuário comum — só vê pontuação, não palpites)
// ================================================================
function renderRanking() {
  var el=document.getElementById('tabRanking');
  var jogosComRes=JOGOS.filter(function(j){var r=resultadosCache[j.id];return r&&r.g1!=='';}).length;

  // Monta ranking apenas com palpites do próprio usuário + dados públicos
  var ranking=[];
  // Cada usuário que está no LOGINS
  LOGINS.forEach(function(login){
    var meus=palpitesCache[login]||{};
    var total=0,exatos=0,feitos=0;
    JOGOS.forEach(function(j){
      var p=meus[j.id];
      if(p&&p.g1!==''&&p.g2!=='') feitos++;
      var pts=calcPontos(p,resultadosCache[j.id]);
      if(pts!==null){total+=pts;if(pts===7)exatos++;}
    });
    ranking.push({nome:login,total:total,exatos:exatos,feitos:feitos});
  });
  ranking.sort(function(a,b){return b.total-a.total||b.exatos-a.exatos;});

  var html='<div class="section-title">RANKING</div>';
  html+='<div class="section-sub">'+jogosComRes+'/48 jogos com resultado</div>';

  if(!ranking.some(function(r){return r.total>0;})){
    html+='<div class="empty-state"><div class="icon">🏆</div><p>Ranking disponível após o Admin carregar os resultados.</p></div>';
    el.innerHTML=html; return;
  }

  html+='<div class="ranking-card">';
  ranking.forEach(function(p,i){
    var cls=i===0?'gold':i===1?'silver':i===2?'bronze':'normal';
    var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1);
    var bg=p.nome===currentUser?'background:rgba(26,122,60,.1);':'';
    html+='<div class="ranking-row" style="'+bg+'" onclick="verDetalhe(\''+esc(p.nome)+'\')">';
    html+='<div class="rank-pos '+cls+'">'+medal+'</div>';
    html+='<div style="flex:1"><div class="rank-nome">'+p.nome+(p.nome===currentUser?' 👈':'')+'</div>';
    html+=(p.exatos>0?'<div style="font-size:.73rem;color:var(--ouro)">⭐ '+p.exatos+' placar(es) exato(s)</div>':'')+'</div>';
    html+='<div style="text-align:right"><div class="rank-pts">'+p.total+'</div><div class="rank-stats">'+p.feitos+'/48</div></div>';
    html+='</div>';
  });
  html+='</div>';
  html+='<p style="font-size:.73rem;color:var(--texto-dim);text-align:center;margin-top:8px;">Toque num participante para ver os palpites dos jogos já iniciados</p>';
  el.innerHTML=html;
}

function carregarPalpitesDaPlanilha() {
  mostrarLoading('Carregando palpites da planilha...');
  gasCarregarPalpites(function(resp) {
    esconderLoading();
    if(!resp||!resp.ok){
      showToast('❌ Erro: '+(resp&&resp.erro?resp.erro:'falha na conexão'), true);
      return;
    }
    // resp.dados = [{usuario, jogo_id, palpite_enc, timestamp}] — já filtrado pelo mais recente por usuário+jogo
    var dados = resp.dados || [];
    // Descriptografa e popula palpitesCache
    dados.forEach(function(linha) {
      var dec = decryptPalpite(linha.palpite_enc);
      if(dec){
        if(!palpitesCache[linha.usuario]) palpitesCache[linha.usuario]={};
        palpitesCache[linha.usuario][linha.jogo_id] = dec;
      }
    });
    cacheCarregado=true;

    // Marca VALIDADOR=OK nos jogos que já têm resultado
    var jogsComRes=JOGOS.filter(function(j){var r=resultadosCache[j.id];return r&&r.g1!=='';}).map(function(j){return j.id;});
    if(jogsComRes.length>0){
      gasMarcarValidador(jogsComRes, function(){});
    }

    showToast('✅ '+dados.length+' palpites carregados!');
    document.getElementById('adminPalpitesConteudo').innerHTML=buildAdminPalpitesView();
  });
}

  if(!cacheCarregado) return '<div class="empty-state"><div class="icon">📊</div><p>Nenhum dado carregado.</p></div>';

  var html='';
  for(var rod=1;rod<=3;rod++){
    html+='<div class="rodada-bloco"><div class="rodada-label">⚽ RODADA '+rod+'</div>';
    JOGOS.filter(function(j){return j.rodada===rod;}).forEach(function(jogo){

      html+=' <span style="font-size:.7rem;color:var(--texto-dim);">'+jogo.data.slice(5).replace('-','/')+' '+jogo.hora+'h</span>';

      html+='</div>';
      // Linha por usuário
      LOGINS.forEach(function(login){
        var p=(palpitesCache[login]||{})[jogo.id];
        var pts=calcPontos(p,r);
        var ptsCls=pts===null?'pts-0':pts===7?'pts-7':pts>=5?'pts-5':pts>=2?'pts-2':'pts-0';
        html+='<div class="palpites-view-row">';
        html+='<div class="pv-usuario">👤 '+login+'</div>';
        if(p&&p.g1!==''&&p.g2!==''){
          html+='<div class="pv-palpite">'+p.g1+' x '+p.g2+'</div>';
          html+='<div class="pv-pts '+ptsCls+'">'+(pts!==null?pts+' pts':'—')+'</div>';
        } else {
          html+='<div class="pv-sem">sem palpite</div><div></div>';
        }
        html+='</div>';
      });
      html+='</div>';
    });
    html+='</div>';
  }
  return html;
}

function salvarResultadoLocal(jogoId) {
  var g1=document.getElementById('ar_'+jogoId+'_g1').value;
  var g2=document.getElementById('ar_'+jogoId+'_g2').value;
  if(g1===''||g2===''){showToast('⚠️ Preencha os dois gols!',true);return;}
  var statEl=document.getElementById('adm_st_'+jogoId);
  statEl.textContent='Salvando...';
  gasSalvarResultado(jogoId, g1, g2, function(resp){
    if(resp && resp.ok){
      resultadosCache[jogoId]={g1:g1,g2:g2};
      localStorage.setItem('bolao26_resultados', JSON.stringify(resultadosCache));
      statEl.textContent='Salvo: '+g1+' x '+g2;
      showToast('✅ Resultado salvo!');
    } else {
      statEl.textContent='';
      showToast('❌ Erro ao salvar: '+(resp&&resp.erro?resp.erro:'falha na conexão'), true);
    }
  });
}

function limparResultado(jogoId) {
  if(!resultadosCache[jogoId]||resultadosCache[jogoId].g1==='') {
    showToast('⚠️ Nenhum resultado para limpar.',true); return;
  }
  var statEl=document.getElementById('adm_st_'+jogoId);
  statEl.textContent='Removendo...';
  gasSalvarResultado(jogoId, '', '', function(resp){
    if(resp && resp.ok){
      delete resultadosCache[jogoId];
      localStorage.setItem('bolao26_resultados', JSON.stringify(resultadosCache));
      document.getElementById('ar_'+jogoId+'_g1').value='';
      document.getElementById('ar_'+jogoId+'_g2').value='';
      statEl.textContent='';
      showToast('🗑️ Resultado removido!');
    } else {
      statEl.textContent='Salvo: '+resultadosCache[jogoId].g1+' x '+resultadosCache[jogoId].g2;
      showToast('❌ Erro ao remover: '+(resp&&resp.erro?resp.erro:'falha na conexão'), true);
    }
  });
}

  // Total sempre considera todos os jogos com resultado, independente do filtro de exibição
  JOGOS.forEach(function(j){
    var pts=calcPontos(meus[j.id], resultadosCache[j.id]);
    if(pts!==null) total+=pts;
  });

  var jogosExibidos = apenasIniciados ? JOGOS.filter(function(j){return jogoTravado(j);}) : JOGOS;

  var linhas='';
  jogosExibidos.forEach(function(j){
    var p=meus[j.id], r=resultadosCache[j.id];
    var pts=calcPontos(p,r);
    var pStr=(p&&p.g1!==''&&p.g2!=='')?p.g1+' x '+p.g2:'—';
    var rStr=(r&&r.g1!=='')?r.g1+' x '+r.g2:'?';
    var cls=pts===null?'pts-0':pts===7?'pts-7':pts>=5?'pts-5':pts>=2?'pts-2':'pts-0';
    linhas+='<div class="detalhe-jogo">';
    linhas+='<div class="dj-times"><img class="flag-sm" src="https://flagcdn.com/20x15/'+j.f1+'.png" alt=""> '+j.t1+' x <img class="flag-sm" src="https://flagcdn.com/20x15/'+j.f2+'.png" alt=""> '+j.t2+'</div>';
    linhas+='<div class="dj-palpite">Palpite: <strong>'+pStr+'</strong> · Real: <strong>'+rStr+'</strong></div>';
    linhas+='<div class="dj-pts '+cls+'">'+(pts!==null?pts+' pts':'—')+'</div>';
    linhas+='</div>';
  });
  if(apenasIniciados && jogosExibidos.length===0){
    linhas='<div class="empty-state"><div class="icon">🔒</div><p>Nenhum jogo iniciado ainda.</p></div>';
  }

  var html='<div class="stats-bar"><div class="stat-pill">🏆 Total: <strong>'+total+' pts</strong></div></div>';
  html+=linhas;
  document.getElementById('detalheContent').innerHTML=html;

  if(currentUser) document.getElementById('appScreen').style.display='none';
  else document.getElementById('adminScreen').style.display='none';
  document.getElementById('detalheScreen').style.display='block';
}

// ================================================================
// UTILITÁRIOS
// ================================================================
function esc(s){ return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function mostrarLoading(txt) {
  document.getElementById('loadingTxt').textContent=txt||'Carregando...';
  document.getElementById('loadingOverlay').classList.add('show');
}
function esconderLoading() {
  document.getElementById('loadingOverlay').classList.remove('show');
}

function showToast(msg,isError) {
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=isError?'var(--vermelho)':'var(--verde)';
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2800);
}
</script>
